<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solar System RAG</title>
    <style>
        body {
            font-family: Verdana, Arial, sans-serif;
            font-size: 15px;
            background-color: #e9e9e9;
            color: #222;
            margin: 0;
        }

        #page {
            max-width: 720px;
            margin: 20px auto;
            background-color: white;
            border: 1px solid #999;
        }

        h1 {
            margin: 0;
            padding: 12px 16px;
            background-color: #2a4d8f;
            color: white;
            font-size: 22px;
            font-weight: normal;
        }

        #content {
            padding: 16px;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            font-family: Verdana, Arial, sans-serif;
            font-size: 15px;
            padding: 6px;
            border: 1px solid #777;
        }

        button {
            font-size: 14px;
            padding: 6px 14px;
            margin-right: 6px;
            border: 1px solid #555;
            background-color: #e2e2e2;
            cursor: pointer;
        }

        button:hover {
            background-color: #d0d0d0;
        }

        button:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        #ask {
            background-color: #f3d36b;
        }

        .note {
            font-size: 12px;
            color: #666;
            margin: 8px 0 0 0;
        }

        hr {
            border: 0;
            border-top: 1px solid #bbb;
            margin: 16px 0;
        }

        #status {
            margin: 0 0 8px 0;
            font-style: italic;
        }

        #status.error {
            color: #b00000;
            font-style: normal;
            font-weight: bold;
        }

        #answer {
            background-color: #eef3fb;
            border: 1px solid #2a4d8f;
            padding: 8px 10px;
            margin-bottom: 12px;
            white-space: pre-wrap;
        }

        h2 {
            font-size: 16px;
            margin: 12px 0 6px 0;
        }

        .source {
            border-left: 4px solid #2a4d8f;
            background-color: #f6f6f6;
            margin: 6px 0;
            padding: 4px 10px;
        }

        .source-id {
            font-family: "Courier New", monospace;
            font-weight: bold;
        }

        .source-text {
            margin: 4px 0 0 0;
            font-size: 13px;
            white-space: pre-wrap;
        }

        #footer {
            border-top: 1px solid #999;
            padding: 8px 16px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="page">
        <h1>Solar System RAG</h1>

        <div id="content">
            <p>Ask a question about the Solar System (planets, moons, comets...).</p>

            <textarea id="q" rows="3" minlength="8" maxlength="512" placeholder="Example: How many moons does Saturn have?"></textarea>
            <p>
                <button id="retrieve">Search only (free)</button>
                <button id="ask">Ask (uses tokens)</button>
            </p>
            <p class="note">
                "Search only" shows the passages found in the documents.
                "Ask" also sends them to the LLM to write an answer, which costs tokens.
            </p>

            <hr>

            <p id="status"></p>
            <div id="answer" hidden></div>
            <div id="sources"></div>
        </div>

        <div id="footer">Small RAG project : FastAPI, LLM answers powered by Claude Haiku 5.5</div>
    </div>

    <script>
        const statusLine = document.getElementById("status");
        const answerBox = document.getElementById("answer");
        const sourcesBox = document.getElementById("sources");

        function showSources(sources) {
            sourcesBox.replaceChildren();

            if (sources.length === 0) {
                statusLine.textContent = "No source found.";
                return;
            }

            const title = document.createElement("h2");
            title.textContent = "Sources (" + sources.length + ")";
            sourcesBox.appendChild(title);

            sources.forEach((source) => {
                const box = document.createElement("div");
                box.className = "source";

                // Id
                const id = document.createElement("div");
                id.className = "source-id";
                id.textContent = source.id;

                // Text
                const text = document.createElement("div");
                text.className = "source-text";
                text.textContent = source.text;

                // Put the base elements in the box and the box inside the main source box
                box.appendChild(id);
                box.appendChild(text);
                sourcesBox.appendChild(box);
            });
        }

        async function send(path) {
            const buttons = document.querySelectorAll("button");
            buttons.forEach(b => b.disabled = true);

            statusLine.className = "";
            statusLine.textContent = "Loading...";
            answerBox.hidden = true;
            sourcesBox.replaceChildren();

            try {
                const r = await fetch(path, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({question: document.getElementById("q").value}),
                });
                const data = await r.json();

                if (!r.ok) {
                    statusLine.className = "error";
                    statusLine.textContent = "Error " + r.status + " : " + JSON.stringify(data.detail);
                    return;
                }

                statusLine.textContent = "";

                if (Array.isArray(data)) {
                    // /Retrieve : only the list of sources
                    showSources(data);
                } else {
                    // /ask : LLM answers + list of sources
                    answerBox.textContent = data.answer;
                    answerBox.hidden = false;
                    showSources(data.sources);
                }
            } catch (e) {
                statusLine.className = "error";
                statusLine.textContent = "Error : " + e;
            } finally {
                buttons.forEach(b => b.disabled = false);
            }
        }

        document.getElementById("retrieve").onclick = () => send("/retrieve");
        document.getElementById("ask").onclick = () => send("/ask");
    </script>
</body>
</html>
